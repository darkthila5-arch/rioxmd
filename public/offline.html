<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050505">
<title>RIO X MD • Offline</title>
<style>
  :root{color-scheme:dark;--accent:#25d366;--accent-2:#7dffb0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center;color:#fafafa;background:radial-gradient(700px 360px at 50% -80px,rgba(37,211,102,.25),transparent 70%) no-repeat,#050505;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  img{width:84px;height:auto;filter:drop-shadow(0 10px 28px rgba(37,211,102,.55))}
  h1{margin:16px 0 8px;font-size:1.6rem}
  p{margin:0 auto 22px;max-width:34ch;color:#a6a6a6;line-height:1.5}
  button{min-height:50px;padding:12px 28px;border:0;border-radius:14px;font:inherit;font-weight:700;color:#03140a;background:linear-gradient(180deg,var(--accent),#1fa855);cursor:pointer}
</style>
</head>
<body>
  <main>
    <img src="/ghost.png" alt="" width="84" height="102">
    <h1>You are offline</h1>
    <p>RIO X MD needs the internet to link your number. Check your connection and try again.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>document.getElementById('retry').addEventListener('click', function () { location.reload(); });</script>
</body>
</html>
